<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Account Age Checker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #0969da;
      --error: #cf222e;
      --success: #1a7f37;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 18px;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"] {
      flex: 1 1 240px;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    input[type="text"]:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 20%, white);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.75;
      cursor: wait;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }

    dl {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 10px 16px;
      margin: 0;
    }

    dt {
      color: var(--muted);
    }

    dd {
      margin: 0;
      font-weight: 600;
      word-break: break-word;
    }

    .status {
      min-height: 1.25em;
      margin: 14px 0 0;
      color: var(--muted);
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    .hidden {
      display: none;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      main {
        padding-top: 28px;
      }

      h1 {
        font-size: 1.6rem;
      }

      dl {
        grid-template-columns: 1fr;
        gap: 4px 0;
      }

      dt {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>GitHub Account Age Checker</h1>
    <p>Look up a GitHub user and see when the account was created.</p>

    <form id="lookup-form" autocomplete="off">
      <label for="username">GitHub username</label>
      <input id="username" name="username" type="text" spellcheck="false" placeholder="octocat" value="octocat" required>
      <button id="check-button" type="submit">Check</button>
    </form>

    <section id="result" class="hidden" aria-live="polite">
      <dl>
        <dt>Username</dt>
        <dd id="result-login">-</dd>
        <dt>Created at</dt>
        <dd id="result-created-at">-</dd>
        <dt>Account age</dt>
        <dd id="result-age">-</dd>
      </dl>
      <div id="status" class="status"></div>
      <div class="hint">Public GitHub data only. No token is used in this page.</div>
    </section>
  </main>

  <script>
    const API_VERSION = "2022-11-28";
    const form = document.getElementById("lookup-form");
    const usernameInput = document.getElementById("username");
    const checkButton = document.getElementById("check-button");
    const result = document.getElementById("result");
    const resultLogin = document.getElementById("result-login");
    const resultCreatedAt = document.getElementById("result-created-at");
    const resultAge = document.getElementById("result-age");
    const status = document.getElementById("status");

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = `status${kind ? ` ${kind}` : ""}`;
    }

    function setBusy(isBusy) {
      checkButton.disabled = isBusy;
      usernameInput.disabled = isBusy;
      checkButton.textContent = isBusy ? "Checking..." : "Check";
    }

    function formatAge(createdAt) {
      const created = new Date(createdAt);
      const diff = Math.max(0, Date.now() - created.getTime());
      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;
      return `${days} days, ${hours} hours, ${minutes} minutes`;
    }

    function formatCreatedAt(createdAt) {
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "medium",
        timeZone: "UTC",
      }).format(new Date(createdAt));
    }

    async function fetchUser(username) {
      const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`, {
        headers: {
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": API_VERSION,
        },
      });

      let payload = {};
      try {
        payload = await response.json();
      } catch {
        payload = {};
      }

      if (!response.ok) {
        const error = new Error(payload.message || `HTTP ${response.status}`);
        error.status = response.status;
        error.payload = payload;
        throw error;
      }

      return payload;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      if (!username) {
        setStatus("Enter a GitHub username.", "error");
        result.classList.add("hidden");
        return;
      }

      setBusy(true);
      setStatus("Loading...", "");
      result.classList.remove("hidden");

      try {
        const user = await fetchUser(username);
        const createdAt = user.created_at;
        if (!createdAt) {
          throw new Error("GitHub response did not include created_at.");
        }

        resultLogin.textContent = user.login || username;
        resultCreatedAt.textContent = formatCreatedAt(createdAt);
        resultAge.textContent = formatAge(createdAt);
        setStatus("Loaded successfully.", "success");
      } catch (error) {
        resultLogin.textContent = "-";
        resultCreatedAt.textContent = "-";
        resultAge.textContent = "-";

        if (error.status === 404) {
          setStatus(`User not found: ${username}`, "error");
        } else if (error.status === 403 || error.status === 429) {
          setStatus("GitHub rejected the request, likely due to rate limiting.", "error");
        } else {
          setStatus(error.message || "Unable to reach GitHub.", "error");
        }
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
